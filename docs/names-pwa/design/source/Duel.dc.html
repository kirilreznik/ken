<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>בחירת שם · דו־קרב</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F2F1; color: #1F1B1E; font-family: Heebo, system-ui, 'Noto Sans Hebrew', Arial, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 20px;">
  <div aria-hidden="true" style="position: absolute; width: 280px; height: 280px; top: 260px; left: 55px; border-radius: 50%; background: #FFCFA8; opacity: 0.2; filter: blur(60px);"></div>

  <header style="position: relative; display: flex; align-items: center; gap: 8px;">
    <button type="button" aria-label="חזרה" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E6DDD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1B1E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 800;">דו־קרב</h1>
    <span style="font-size: 12px; font-weight: 700; color: #4A4149;">{{progress}}</span>
  </header>

  <div style="position: relative; display: flex; flex-direction: column; gap: 6px;">
    <div role="progressbar" aria-label="התקדמות הדו־קרב" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="height: 6px; border-radius: 999px; background: #E6DDD6; overflow: hidden;">
      <div style="height: 6px; border-radius: 999px; background: #C97A3E; width: {{pctStyle}};"></div>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 23px; font-weight: 500; color: #4A4149;">איזה מהשניים?</p>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 12px;">
    <button type="button" onClick="{{pickA}}" style="min-height: 180px; border-radius: 30px; border: none; background: #FFFFFF; box-shadow: 0 18px 36px -18px rgba(31,27,30,0.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #1F1B1E;">
      <span style="font-size: 48px; line-height: 56px; font-weight: 800;">{{a.name}}</span>
      <span style="font-size: 12px; font-weight: 500; color: #6E655F;">{{a.meta}}</span>
    </button>
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 40px; margin: -32px 0; z-index: 1; border-radius: 50%; background: #1F1B1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border: 3px solid #F4F2F1;">או</div>
    <button type="button" onClick="{{pickB}}" style="min-height: 180px; border-radius: 30px; border: none; background: #FFFFFF; box-shadow: 0 18px 36px -18px rgba(31,27,30,0.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #1F1B1E;">
      <span style="font-size: 48px; line-height: 56px; font-weight: 800;">{{b.name}}</span>
      <span style="font-size: 12px; font-weight: 500; color: #6E655F;">{{b.meta}}</span>
    </button>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700;">החמישייה עד עכשיו</span>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; gap: 8px; flex-wrap: wrap;">
      <sc-for list="{{top}}" as="t" hint-placeholder-count="2">
        <li style="padding: 6px 12px; border-radius: 999px; background: #1F1B1E; color: #FFFFFF; font-size: 12px; font-weight: 700;">{{t.label}}</li>
      </sc-for>
    </ol>
  </div>

  <div style="position: relative; margin-top: auto; display: flex; align-items: center; justify-content: space-between;">
    <button type="button" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #4A4149; font-size: 13px; font-weight: 700; text-decoration: underline;">עצירה, אפשר להמשיך אחר כך</button>
    <span style="font-size: 11px; font-weight: 500; color: #6E655F;">לדוגמה בלבד</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { round: 0, top: ['אריאל'] };
  }
  renderVals() {
    const pairs = [
      [{ name: 'תמר', meta: 'בת · → יציב' }, { name: 'לביא', meta: 'בן · ↗ בעלייה' }],
      [{ name: 'נועם', meta: 'מתאים לכולם · → יציב' }, { name: 'שקד', meta: 'מתאים לכולם · → יציב' }],
      [{ name: 'רוני', meta: 'מתאים לכולם · ↘ בירידה' }, { name: 'אלה', meta: 'בת · → יציב' }],
      [{ name: 'אורי', meta: 'מתאים לכולם · → יציב' }, { name: 'יעל', meta: 'בת · → יציב' }]
    ];
    const total = 6;
    const r = this.state.round;
    const [a, b] = pairs[r % pairs.length];
    const pick = (n) => () => this.setState((s) => ({
      round: s.round + 1,
      top: s.top.indexOf(n) >= 0 ? s.top : s.top.concat(n).slice(-5)
    }));
    const done = Math.min(r + 1, total);
    const pct = Math.round((done / total) * 100);
    return {
      a, b,
      pickA: pick(a.name),
      pickB: pick(b.name),
      progress: 'סיבוב ' + done + ' מתוך ' + total,
      pct,
      pctStyle: pct + '%',
      top: this.state.top.map((n, i) => ({ label: (i + 1) + '. ' + n }))
    };
  }
}
</script>
</body>
</html>
