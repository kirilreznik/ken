<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>בחירת שם · רקע למסך</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.bg{background-size:cover;background-position:center}
</style>
</helmet>
<div dir="rtl" class="bg" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; color: #1F1B1E; font-family: Heebo, system-ui, 'Noto Sans Hebrew', Arial, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; background-color: #F4F2F1; background-image: {{bgImage}};">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31,27,30,0.35);"></div>

  <section role="dialog" aria-label="רקע למסך" style="position: relative; background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px;">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #E6DDD6;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 800;">רקע למסך</h2>
      <button type="button" aria-label="סגירה" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E6DDD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F1B1E;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div role="radiogroup" aria-label="בחירת רקע" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{o.checked}}" aria-label="{{o.label}}" onClick="{{o.pick}}" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; gap: 6px; align-items: stretch; color: #1F1B1E;">
          <span style="{{o.thumbStyle}}">
            <sc-if value="{{o.isNone}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="width: 40px; height: 52px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 8px 20px rgba(31,27,30,0.08);"></span>
            </sc-if>
            <sc-if value="{{o.isUpload}}" hint-placeholder-val="{{ false }}">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F1B1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
            </sc-if>
            <sc-if value="{{o.checked}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; background: #1F1B1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
              </span>
            </sc-if>
          </span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 700; text-align: center;">{{o.label}}</span>
          <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #6E655F; text-align: center;">{{o.sub}}</span>
        </button>
      </sc-for>
    </div>

    <div style="border-radius: 16px; background: #F4F2F1; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px;"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span style="font-size: 12.5px; line-height: 19px; font-weight: 500; color: #4A4149;">תמונה משלכם נשמרת רק בטלפון הזה. היא לא עולה לשרת ולא מוצגת למי שבוחר איתכם.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'fabric' };
  }
  renderVals() {
    const imgs = {
      fabric: '../../../../../assets/images/names/fabric.jpg',
      notebook: '../../../../../assets/images/names/notebook.jpg',
      nursery: '../../../../../assets/images/names/nursery.jpg'
    };
    const list = [
      { id: 'none', label: 'ללא רקע', sub: 'כרטיסים לבנים' },
      { id: 'fabric', label: 'בדים', sub: 'ברירת מחדל' },
      { id: 'notebook', label: 'מחברת', sub: '' },
      { id: 'nursery', label: 'חדר תינוק', sub: '' },
      { id: 'upload', label: 'תמונה משלי', sub: 'מהגלריה' }
    ];
    const base = 'position: relative; height: 120px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; box-sizing: border-box;';
    const options = list.map((o) => {
      const checked = this.state.picked === o.id;
      let fill = 'background-color: #F4F2F1;';
      if (imgs[o.id]) fill = 'background-color: #F1EBE6; background-image: url(' + imgs[o.id] + ');';
      if (o.id === 'upload') fill = 'background-color: #FFF6EE; border: 1.5px dashed #B5ACA6;';
      const ring = checked ? ' outline: 3px solid #1F1B1E; outline-offset: 2px;' : (o.id === 'upload' ? '' : ' border: 1px solid #E6DDD6;');
      return Object.assign({}, o, {
        checked,
        isNone: o.id === 'none',
        isUpload: o.id === 'upload',
        sub: checked ? 'נבחר' : o.sub,
        thumbStyle: base + fill + ring,
        pick: () => this.setState({ picked: o.id })
      });
    });
    const bgImage = imgs[this.state.picked] ? 'url(' + imgs[this.state.picked] + ')' : 'none';
    return { options, bgImage };
  }
}
</script>
</body>
</html>
